[workspace]
resolver = "3"
members = [
    "crates/firecal-types",
    "crates/firecal-ingest",
    "crates/firecal-harmonize",
    "crates/firecal-query",
    "crates/firecal-wasm",
    "crates/firecal-testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/looprotate/firecal"
description = "Harmonized MODIS and VIIRS burning activity calendar"
publish = false

[workspace.dependencies]
firecal-types = { path = "crates/firecal-types" }
firecal-query = { path = "crates/firecal-query" }
firecal-testkit = { path = "crates/firecal-testkit" }

# Every crate opts in with `[lints] workspace = true`. Nobody weakens this table to get a green build;
# one case is allowed with `#[expect(lint, reason = "...")]` on that item.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Conflicts with the rust lint `unreachable_pub`, which we keep.
redundant_pub_crate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
mem_forget = "deny"
exit = "deny"
string_slice = "deny"
lossy_float_literal = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"

# Debug: the strictest. Every check the compiler can do at run time is on.
[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true
panic = "unwind"

# Release: the most aggressive, and still checked. Overflow checks stay on on purpose: a wrong count is
# worse than a slower one. `target-cpu=native` is NOT used: it would break the same-bytes guarantee between
# machines and wasm.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug-assertions = false
incremental = false
strip = "symbols"
debug = false
